<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
<main class="login-main">
    <section class="details login-box">
        <h1>Fabflix Login</h1>

        <form id="login-form" method="post" action="api/login">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <div class="g-recaptcha" data-sitekey="6LcfOA4uAAAAALMCKqvh2FV2TE71Jmvs-vRAKEhz" style="margin-top: 16px;"></div>

            <button id="login-button" type="submit">Log in</button>
        </form>

        <p id="login-error" class="status error" hidden></p>
    </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
